name: Instagram anahtar yenileme

# Instagram uzun ömürlü erişim anahtarı 60 günde sona erer. Bu iş her hafta
# anahtarları yeniler ve yeni anahtarı aynı ada sahip sırra yazar.
# IG_ACCESS_TOKEN: @aziz.tahin, IG_ACCESS_TOKEN_ZIFIR: Zifir sanatçı hesabı.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  yenile:
    runs-on: ubuntu-latest
    steps:
      - name: Anahtarları yenile
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN_ZIFIR: ${{ secrets.IG_ACCESS_TOKEN_ZIFIR }}
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::GH_SECRETS_TOKEN tanımlı değil; kurulum tamamlanmamış."
            exit 0
          fi
          hata=0
          for ad in IG_ACCESS_TOKEN IG_ACCESS_TOKEN_ZIFIR; do
            eski="${!ad}"
            if [ -z "$eski" ]; then
              echo "::warning::$ad tanımlı değil; atlandı."
              continue
            fi
            yanit=$(curl -sS --get "https://graph.instagram.com/refresh_access_token" \
              --data-urlencode "grant_type=ig_refresh_token" \
              --data-urlencode "access_token=${eski}")
            yeni=$(printf '%s' "$yanit" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("access_token",""))')
            if [ -z "$yeni" ]; then
              echo "$ad yenileme başarısız:"
              printf '%s' "$yanit" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("error",{}).get("message","bilinmeyen hata"))'
              hata=1
              continue
            fi
            echo "::add-mask::$yeni"
            gh secret set "$ad" --repo "$GITHUB_REPOSITORY" --body "$yeni"
            echo "$ad yenilendi."
          done
          exit $hata
