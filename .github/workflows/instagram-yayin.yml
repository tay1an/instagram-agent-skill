name: Instagram yayın

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      kuru_calisma:
        description: "Deneme: hiçbir şey yayınlama, sadece ne yapılacağını göster"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: instagram-yayin
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest
    steps:
      # Sıradaki iş, öndeki iş bitene kadar bekleyebiliyor. Kuyruğa girdiği
      # andaki commit'i değil dalın en son halini alır; yoksa öndeki işin
      # yayınladığı paylaşımı "bekliyor" görüp ikinci kez paylaşır.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Medya adresi için commit
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zamanı gelen paylaşımları yayınla
        id: yayin
        continue-on-error: true
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          KURU_CALISMA: ${{ inputs.kuru_calisma && '1' || '0' }}
          MEDYA_SHA: ${{ steps.sha.outputs.sha }}
          SONUC_DOSYASI: ${{ runner.temp }}/yayin-sonuc.json
        run: python scripts/instagram_yayinla.py

      # ManyChat kullanıldığı için kapalı. Açmak için depo değişkeni
      # YORUM_OTOMASYONU=acik yapılır (aynı kişiye iki kez mesaj gitmesin).
      # Yorum durumu (kimlik numaraları) herkese açık depoya değil, Actions
      # önbelleğine yazılır.
      - name: Yorum durumunu önbellekten al
        if: vars.YORUM_OTOMASYONU == 'acik'
        uses: actions/cache/restore@v4
        with:
          path: .yorum-durumu
          key: yorum-durumu-${{ github.run_id }}
          restore-keys: yorum-durumu-

      - name: Yorumlara TAHİN yazanlara tarif gönder
        id: yorum
        if: vars.YORUM_OTOMASYONU == 'acik'
        continue-on-error: true
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          KURU_CALISMA: ${{ inputs.kuru_calisma && '1' || '0' }}
        run: python scripts/instagram_yorum_tarif.py

      - name: Yorum durumunu önbelleğe kaydet
        if: always() && vars.YORUM_OTOMASYONU == 'acik' && inputs.kuru_calisma != true
        uses: actions/cache/save@v4
        with:
          path: .yorum-durumu
          key: yorum-durumu-${{ github.run_id }}

      # Yalnızca bu çalışmada değişen paylaşımlar dalın EN SON takvimine
      # uygulanır. Böylece başka bir oturum aynı anda takvimi değiştirse bile
      # çakışma çıkmaz ve "yayınlandı" bilgisi kaybolmaz (kaybolursa sonraki
      # çalışma aynı paylaşımı ikinci kez yapar).
      - name: Takvimdeki durumları kaydet
        if: always()
        env:
          SONUC: ${{ runner.temp }}/yayin-sonuc.json
        run: |
          takvim=".claude/instagram/yayin/takvim.json"
          if [ ! -s "$SONUC" ] || [ "$(cat "$SONUC")" = "[]" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for deneme in 1 2 3 4 5; do
            git fetch -q origin "${GITHUB_REF_NAME}"
            git reset -q --hard "origin/${GITHUB_REF_NAME}"
            python3 - "$SONUC" "$takvim" <<'PY'
          import json, sys
          sonuc, yol = sys.argv[1], sys.argv[2]
          degisen = {p["id"]: p for p in json.load(open(sonuc, encoding="utf-8"))}
          takvim = json.load(open(yol, encoding="utf-8"))
          alanlar = ("durum", "medya_id", "yayin_zamani", "deneme", "hata")
          for p in takvim["paylasimlar"]:
              yeni = degisen.get(p["id"])
              if not yeni:
                  continue
              for a in alanlar:
                  if a in yeni:
                      p[a] = yeni[a]
                  else:
                      p.pop(a, None)
          with open(yol, "w", encoding="utf-8") as f:
              json.dump(takvim, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY
            if git diff --quiet -- "$takvim"; then
              exit 0
            fi
            git commit -q -m "Instagram: yayın durumu güncellendi" -- "$takvim"
            if git push -q origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep $((deneme * 5))
          done
          echo "::error::Yayın durumu takvime yazılamadı; aynı paylaşım ikinci kez yapılabilir."
          cat "$SONUC"
          exit 1

      - name: Hata varsa işi başarısız say
        if: steps.yayin.outcome == 'failure' || steps.yorum.outcome == 'failure'
        run: |
          echo "Bir paylaşım ya da tarif gönderimi başarısız oldu; yukarıdaki adımların kayıtlarına bakın."
          exit 1
